# Общие правила анализа для Dart-пакетов (shared, server, worker).
# Приложение использует свой analysis_options.yaml на базе flutter_lints.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
    - unawaited_futures
