# Локальное окружение GameRadar.
#   docker compose up -d                  — PostgreSQL + Redis + применение миграций
#   docker compose --profile full up -d   — то же + server и worker (после этапов 3–4)
name: gameradar

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameradar}
      POSTGRES_USER: ${POSTGRES_USER:-gameradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    # Порт 5433 на хосте, чтобы не конфликтовать с локально установленным PostgreSQL.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # AOF, чтобы очередь задач worker переживала перезапуск.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Применяет SQL-миграции из ./migrations и завершается.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.21
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gameradar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameradar}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: ["full"]
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gameradar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameradar}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gameradar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gameradar}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
