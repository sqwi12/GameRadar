name: gameradar_app
description: "GameRadar — мобильное приложение для отслеживания скидок и онлайна игр."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  cached_network_image: ^4.0.4
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  gameradar_shared:
    path: ../shared
  go_router: ^18.0.2
  home_widget: ^0.10.0
  intl: ^0.20.3
  liquid_glass_widgets: 1.8.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Локализации из lib/l10n/*.arb генерируются в lib/l10n/gen.
  generate: true

# Иконка приложения: исходники рисует tool/make_icon.py,
# пересборка — dart run flutter_launcher_icons.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/foreground.png
  min_sdk_android: 21
