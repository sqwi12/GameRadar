name: gameradar_app
description: "GameRadar — мобильное приложение для отслеживания скидок и онлайна игр."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  gameradar_shared:
    path: ../shared
  go_router: ^18.0.2
  intl: ^0.20.3
  material_ui: ^1.6.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  # Локализации из lib/l10n/*.arb генерируются в lib/l10n/gen.
  generate: true
